<div *ngIf="show" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-50 px-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl overflow-hidden">
        <div class="px-6 py-4 bg-green-600 text-white flex justify-between items-center">
            <h3 class="text-lg font-semibold">{{ isEditing ? 'Editar Evento' : 'Criar Evento' }}</h3>
            <button (click)="close()" class="text-white hover:text-green-200">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
        </div>

        <form [formGroup]="eventForm" (ngSubmit)="onSubmit()" class="px-6 py-4 space-y-4 max-h-[80vh] overflow-y-auto">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Título</label>
                <input type="text" formControlName="title"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Subtítulo</label>
                <input type="text" formControlName="subtitle" maxlength="255"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Descrição</label>
                <quill-editor formControlName="description" class="w-full block" [styles]="{height: '200px'}"
                    placeholder="Digite a descrição detalhada do evento aqui..." [modules]="{toolbar: [
                        ['bold', 'italic', 'underline', 'strike'],
                        [{'header': 1}, {'header': 2}],
                        [{'list': 'ordered'}, {'list': 'bullet'}],
                        ['clean']
                    ]}">
                </quill-editor>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Data e Hora</label>
                    <input type="datetime-local" formControlName="date"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Capacidade</label>
                    <input type="number" formControlName="capacity"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-green-500">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Local</label>
                    <input type="text" formControlName="location"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Carga Horária (horas)</label>
                    <input type="number" min="1" formControlName="workload_hours"
                        placeholder="Ex.: 8"
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-green-500">
                    <p class="text-xs text-gray-500 mt-1">Usado no texto do certificado de participação.</p>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Capa do Evento</label>
                <input type="file" accept="image/*" (change)="onFileSelected($event)"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-green-500 bg-white">
                <p *ngIf="isEditing" class="text-xs text-gray-500 mt-1">Selecione uma nova imagem apenas se quiser
                    alterar a capa atual.</p>
            </div>

            <div class="pt-4 flex justify-end space-x-3">
                <button type="button" (click)="close()"
                    class="px-4 py-2 border border-gray-300 rounded text-gray-700 hover:bg-gray-50 focus:outline-none">Cancelar</button>
                <button type="submit" [disabled]="eventForm.invalid || isSubmitting"
                    class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 focus:outline-none disabled:bg-green-400">
                    {{ isSubmitting ? 'Salvando...' : 'Salvar' }}
                </button>
            </div>
        </form>
    </div>
</div>
