<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
            Definir senha
        </h2>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">

            <div *ngIf="!linkIsValid" class="text-center space-y-4">
                <p class="text-sm text-gray-600">Este link está incompleto ou inválido.</p>
                <a routerLink="/login" class="text-sm font-medium text-green-600 hover:text-green-700">Voltar para o login</a>
            </div>

            <form *ngIf="linkIsValid" [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
                <p class="text-sm text-gray-500">{{ email }}</p>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Nova senha</label>
                    <div class="mt-1">
                        <input id="password" type="password" formControlName="password" minlength="8"
                            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm">
                    </div>
                    <p class="mt-1 text-xs text-gray-400">Mínimo de 8 caracteres.</p>
                </div>

                <div>
                    <label for="password_confirmation" class="block text-sm font-medium text-gray-700">Confirme a senha</label>
                    <div class="mt-1">
                        <input id="password_confirmation" type="password" formControlName="password_confirmation"
                            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm">
                    </div>
                </div>

                <div>
                    <button type="submit" [disabled]="form.invalid || isSubmitting"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:bg-green-400">
                        {{ isSubmitting ? 'Salvando...' : 'Definir senha' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
