<div class="max-w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Eventos Arquivados</h1>
            <p class="text-sm text-gray-500 mt-1">Eventos que não aparecem na landing page nem em "Meus Eventos"</p>
        </div>
        <a routerLink="/admin/events"
            class="px-4 py-2 rounded border border-gray-300 text-gray-700 hover:bg-gray-50 focus:outline-none">
            Voltar para Meus Eventos
        </a>
    </div>

    <div *ngIf="isLoading" class="flex justify-center p-10">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-green-600"></div>
    </div>

    <div *ngIf="error" class="bg-red-100 text-red-700 p-4 rounded mb-6">
        {{ error }}
    </div>

    <div *ngIf="!isLoading" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
        <div *ngFor="let event of events" class="bg-white rounded-lg shadow overflow-hidden flex flex-col opacity-90">

            <div class="relative h-36"
                [ngClass]="(event | eventCover:'mobile') ? '' : 'bg-gradient-to-br from-gray-500 to-gray-700'">
                <img *ngIf="event | eventCover:'mobile' as cover" [src]="cover" [alt]="event.title"
                    class="w-full h-full object-cover grayscale">
                <svg *ngIf="!(event | eventCover:'mobile')" class="absolute inset-0 m-auto h-10 w-10 text-white/70" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <span class="absolute top-3 left-3 px-2 py-0.5 rounded text-xs font-semibold bg-gray-800 text-white">
                    Arquivado
                </span>
            </div>

            <div class="p-5 flex-1 flex flex-col">
                <h3 class="font-semibold text-gray-900">{{ event.title }}</h3>
                <div class="flex items-center gap-1.5 text-sm text-gray-500 mt-1">
                    <svg class="h-4 w-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    {{ event.date | date:'dd/MM/yyyy HH:mm':'UTC' }}
                </div>

                <div class="flex items-center gap-4 text-sm text-gray-500 mt-3 pt-3 border-t border-gray-100">
                    <span class="flex items-center gap-1 truncate">
                        <svg class="h-4 w-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17.657 16.657L13.414 20.9a2 2 0 01-2.828 0l-4.243-4.243a8 8 0 1111.314 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <span class="truncate">{{ event.location }}</span>
                    </span>
                </div>

                <div class="flex gap-3 mt-4 pt-4 border-t border-gray-100">
                    <a [routerLink]="['/admin/events', event.id, 'participants']"
                        class="flex-1 text-center px-3 py-2 rounded border border-gray-300 text-gray-700 text-sm font-medium hover:bg-gray-50 transition-colors">
                        Ver Detalhes
                    </a>
                </div>
                <button (click)="restoreEvent(event)"
                    class="mt-3 w-full text-center px-3 py-2 rounded bg-green-600 text-white text-sm font-medium hover:bg-green-700 transition-colors">
                    Restaurar
                </button>
            </div>
        </div>

        <p *ngIf="events.length === 0" class="col-span-full text-center text-sm text-gray-500 py-12">
            Nenhum evento arquivado.
        </p>
    </div>

</div>
