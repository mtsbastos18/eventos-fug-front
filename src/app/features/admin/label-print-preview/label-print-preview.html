<div *ngIf="!hasJob" class="flex items-center justify-center min-h-screen bg-gray-100 px-4">
    <div class="text-center">
        <p class="text-gray-700 font-medium">Nenhuma etiqueta para exibir.</p>
        <p class="text-gray-500 text-sm mt-1">Volte à tela de impressão de etiquetas e selecione os participantes.</p>
    </div>
</div>

<ng-container *ngIf="hasJob">
    <header class="print-hide sticky top-0 z-10 bg-green-600 text-white px-4 py-3 flex items-center gap-4 shadow">
        <span class="font-semibold">{{ participants.length }} etiqueta(s) - {{ eventTitle }}</span>
        <span class="text-sm opacity-90">{{ statusMessage }}</span>
        <div class="ml-auto flex gap-2">
            <button (click)="close()"
                class="px-3 py-1.5 bg-white/10 hover:bg-white/20 rounded text-sm font-medium transition-colors">
                Fechar
            </button>
            <button (click)="print()" [disabled]="!isReady"
                class="px-3 py-1.5 bg-white text-green-700 hover:bg-gray-100 disabled:opacity-50 rounded text-sm font-medium transition-colors">
                Imprimir
            </button>
        </div>
    </header>

    <main class="label-print-grid">
        <div class="label" *ngFor="let p of participants"
            [class.label--29x90]="(config?.labelSize || '29x90') === '29x90'"
            [class.label--38x90]="config?.labelSize === '38x90'"
            [style.text-align]="config?.align">
            <div class="label__strip" [style.font-size.mm]="config?.fontSizeMm?.eventName">{{ eventTitle }}</div>
            <div class="label__body">
                <div class="label__name" [style.font-size.mm]="config?.fontSizeMm?.name">{{ displayName(p) }}</div>
                <div *ngIf="config?.fields?.company && p.company" [style.font-size.mm]="config?.fontSizeMm?.extra">
                    {{ p.company }}</div>
                <div *ngIf="config?.fields?.position && p.position" [style.font-size.mm]="config?.fontSizeMm?.extra">
                    {{ p.position }}</div>
                <div *ngIf="config?.fields?.city && p.city" [style.font-size.mm]="config?.fontSizeMm?.extra">
                    {{ p.city }}</div>
            </div>
            <!-- <app-qr-code [value]="p.checkin_token || ''" [sizePx]="68"></app-qr-code> -->
        </div>
    </main>
</ng-container>
