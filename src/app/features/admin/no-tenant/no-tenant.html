<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
    <div class="w-full max-w-md text-center">
        <h1 class="text-2xl font-semibold text-gray-900 mb-2">Nenhum cliente disponível</h1>
        <p class="text-gray-500 mb-8">Sua conta ainda não está vinculada a nenhum cliente. Fale com o administrador
            responsável para solicitar acesso.</p>
        <button type="button" (click)="logout()"
            class="px-4 py-2 rounded-md text-sm font-medium text-white bg-green-600 hover:bg-green-700 transition-colors">
            Sair
        </button>
    </div>
</div>
