<div class="max-w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Clientes</h1>
            <p class="text-sm text-gray-500 mt-1">Gerencie os clientes da plataforma</p>
        </div>
        <button (click)="openCreate()"
            class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 focus:outline-none">
            + Novo Cliente
        </button>
    </div>

    <div *ngIf="isLoading" class="flex justify-center p-10">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-green-600"></div>
    </div>

    <div *ngIf="!isLoading" class="bg-white rounded-lg shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Cliente</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Slug</th>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                    <th class="px-4 py-3"></th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <tr *ngFor="let tenant of tenants">
                    <td class="px-4 py-3 flex items-center gap-3">
                        <img *ngIf="tenant.logo_url" [src]="tenant.logo_url" [alt]="tenant.name" class="h-8 w-8 object-contain">
                        <span class="font-medium text-gray-900">{{ tenant.name }}</span>
                    </td>
                    <td class="px-4 py-3 text-sm text-gray-500">{{ tenant.slug }}</td>
                    <td class="px-4 py-3">
                        <span class="px-2 py-0.5 rounded text-xs font-semibold"
                            [ngClass]="tenant.status === 'active' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-700'">
                            {{ tenant.status === 'active' ? 'Ativo' : 'Suspenso' }}
                        </span>
                    </td>
                    <td class="px-4 py-3 text-right space-x-3">
                        <button (click)="openEdit(tenant)" class="text-sm text-gray-600 hover:text-gray-900">Editar</button>
                        <button (click)="remove(tenant)" class="text-sm text-red-600 hover:text-red-800">Excluir</button>
                    </td>
                </tr>
                <tr *ngIf="tenants.length === 0">
                    <td colspan="4" class="px-4 py-10 text-center text-sm text-gray-400">Nenhum cliente cadastrado ainda.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <app-tenant-form-modal [show]="showModal" [tenantToEdit]="tenantToEdit" (saved)="onSaved()" (closed)="onClosed()">
    </app-tenant-form-modal>
</div>
